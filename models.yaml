# Every model the refiner knows, in the same shape as Kaapi's model catalog.
# The refiner reads this for routing, output limits and the reasoning setting; the chat UI reads it (GET /models)
# for its model pickers and defaults. Add a model here and it shows up everywhere; set is_active: false to hide it.
#
# Fields
#   provider            anthropic | openai | google | sarvamai | elevenlabs
#   model_name          the provider's model id
#   label               name shown in the UI
#   completion_type     what the model produces: text, tts, stt (empty for embeddings)
#   roles               which agents may use it: agent (the chat), parser, judge, generator, scorer.
#                       Empty = not offered in the UI (speech and embedding models)
#   tools               can call tools (the judge needs this)
#   config              tunable settings, Kaapi style: type, default, options/min/max, description.
#                       The reasoning setting is `effort` (Anthropic, OpenAI) or `thinking_level` (Google); the UI's
#                       effort (low | medium | high) is passed as is, or the model's default if it does not list it.
#                       A model without one runs without a reasoning setting.
#   input_modalities    what can be sent: TEXT, IMAGE, PDF, AUDIO
#   pricing             USD per million tokens (response, batch, audio); null when not known
#   is_active           false hides it

defaults: {agent: claude-opus-5-5, parser: claude-sonnet-5-5, judge: claude-sonnet-5-5, generator: claude-sonnet-5-5, scorer: claude-sonnet-5-5, effort: high}
models:
- provider: anthropic
  model_name: claude-opus-5-5
  label: Claude Opus 5.5
  completion_type: [text]
  roles: [agent, parser, judge, generator, scorer]
  tools: true
  config:
    effort:
      type: enum
      default: medium
      options: [low, medium, high, xhigh, max]
      description: Reasoning depth with adaptive thinking. Higher = better but slower/costlier.
    max_output_tokens: {type: int, min: 1, max: 128000, default: 16000, description: 'Max tokens in the response, thinking included.'}
  input_modalities: [TEXT, IMAGE, PDF]
  output_modalities: [TEXT]
  pricing:
    response: {input_token_cost: 4, output_token_cost: 20}
    batch: {input_token_cost: 2, output_token_cost: 10}
  is_active: true
