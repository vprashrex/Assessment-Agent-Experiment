[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-refiner"
version = "0.1.0"
description = "Refines an assessment prompt until a scoring model agrees with human reference judgements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5",
    "openai>=3.14",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pillow>=10",
    "fastmcp>=4.1",
    "google-genai>=2.30",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.scripts]
refiner = "refiner.__main__:main"
refiner-mcp = "refiner.mcp.server:main"
refiner-server = "refiner.mcp.server:serve"

[tool.setuptools]
packages = ["refiner", "refiner.agents", "refiner.agents.providers", "refiner.engine", "refiner.mcp", "refiner.prompts", "refiner.utils"]

[tool.setuptools.package-data]
"refiner.prompts" = ["*.md", "**/*.md"]
