[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-refiner"
version = "0.1.0"
description = "Refines an assessment prompt until a scoring model agrees with human reference judgements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5",
    "openai>=3.14",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pillow>=10",
    "fastmcp>=4.1",
    "langfuse>=4.17",
]

[project.scripts]
refiner = "refiner.__main__:main"
refiner-mcp = "refiner.mcp_server:main"

[tool.setuptools]
packages = ["refiner"]

[tool.setuptools.package-data]
refiner = ["prompts/*.md"]
